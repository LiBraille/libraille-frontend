<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiBraille</title>
  <meta name="description"
    content="LiBraille: dispositivo e conversor que transformam livros EPUB e TXT em braille para leitura tátil." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./src/assets/logo.png" />
  <!-- Aplica o tema salvo ANTES de a página ser desenhada (evita o "piscar").
       Por isso fica no <head>. A mesma lógica existe no ThemeContext.jsx. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Botão de acessibilidade (Sienna). Fixe a versão no endereço, ex.: sienna-accessibility@X.Y.Z -->
  <script src="https://cdn.jsdelivr.net/npm/sienna-accessibility/dist/sienna-accessibility.umd.js" async></script>
</body>

</html>
